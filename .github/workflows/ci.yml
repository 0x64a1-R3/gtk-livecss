name: Build, Package & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.3 or v1.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install build & lint dependencies
        run: pacman -Syu --noconfirm cmake namcap

      - name: Build with CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -Wno-dev
          cmake --build build

      - name: Lint PKGBUILD and install script with namcap
        run: namcap packaging/arch/PKGBUILD packaging/arch/gtk-livecss.install

      - name: Package build artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist staging
          DESTDIR="$PWD/staging" cmake --install build
          install -Dm644 LICENSE "staging/usr/share/licenses/gtk-livecss/LICENSE"
          install -Dm644 README.md "staging/usr/share/doc/gtk-livecss/README.md"
          tar -czf "dist/gtk-livecss-linux-x86_64.tar.gz" -C staging/usr .

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*.tar.gz

  release:
    needs: build-and-lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist

      - name: Determine release mode and version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_VER="${{ inputs.version }}"
            VERSION="${RAW_VER#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version: $RAW_VER (use semver like 1.0.3 or v1.0.3)"
              exit 1
            fi
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "mode=rolling" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --- TRACK A: Rolling 'latest' pre-release on every push to main ---
      - name: Move rolling 'latest' tag to HEAD
        if: steps.meta.outputs.mode == 'rolling'
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin latest

      - name: Update rolling 'latest' pre-release
        if: steps.meta.outputs.mode == 'rolling'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Pre-release
          prerelease: true
          make_latest: false
          body: "Automated rolling pre-release built from `main` (${{ github.sha }})."
          files: dist/*.tar.gz

      # --- TRACK B: Official versioned release + PKGBUILD update ---
      - name: Create and push version tag (UI dispatch)
        if: steps.meta.outputs.mode == 'release' && github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists!"
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish versioned GitHub release
        if: steps.meta.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/*.tar.gz

      - name: Update PKGBUILD version and sha256sums
        if: steps.meta.outputs.mode == 'release'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          TARBALL_URL="https://github.com/0x64a1-R3/gtk-livecss/archive/refs/tags/${TAG}.tar.gz"

          SHA256=$(curl --retry 5 --retry-delay 2 -fsSL "$TARBALL_URL" | sha256sum | awk '{print $1}')

          git fetch origin main
          git checkout main

          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/arch/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA256}')/" packaging/arch/PKGBUILD

          git add packaging/arch/PKGBUILD
          git diff --cached --quiet || git commit -m "chore(arch): update PKGBUILD to ${TAG} [skip ci]"
          git push origin main